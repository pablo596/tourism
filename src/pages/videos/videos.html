<ion-header>

  <ion-navbar color="pederNaranja">
    <ion-title>Videos</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <div *ngFor="let v of nvideo; let i = index" >
    <iframe width="100%"
    height="315"
    [src]="trustedVideoUrl[i] ? trustedVideoUrl[i] : null"
    (load)="trustedVideoUrl[i] ? handleIFrameLoadEvent() : null"
    frameborder="0"
    allowfullscreen></iframe>
  </div>
  <!-- <iframe   src="https://www.youtube.com/embed/wkQ_eGqalVw" frameborder="0" allowfullscreen width="100%" frameborder="1"></iframe> -->
</ion-content>
