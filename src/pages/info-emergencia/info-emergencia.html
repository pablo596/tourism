<ion-header>

  <ion-navbar color="pederNaranja">
    <ion-title>En caso de Emergencia</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>

  <ion-grid>

      <ion-col (click)="llamrEmergencia('911')" >
        <img [ngStyle]="{'border-radius': '12%'}" src="{{this.server.DOMAINIMG}}/archivos/toma/ecu911.png/200x200" (load)="si ? handleIFrameLoadEvent() : null" alt="" srcset="">

      <ion-col (click)="llamrEmergencia('135')">

      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col (click)="llamrEmergencia('052681102')">
        <img [ngStyle]="{'border-radius': '12%'}" src="{{this.server.DOMAINIMG}}/archivos/toma/bomberos.png/200x200" alt="" srcset="">
      </ion-col>
      <ion-col (click)="llamrEmergencia('0990696167')">
        <img [ngStyle]="{'border-radius': '12%'}" src="{{this.server.DOMAINIMG}}/archivos/toma/salvavidas.png/200x200" alt="" srcset="">
