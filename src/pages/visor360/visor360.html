<ion-header>

  <ion-navbar color="pederNaranja">
    <ion-title>Visor 360</ion-title>
  </ion-navbar>

</ion-header>


<ion-content no-padding>
  <ion-grid>
    <ion-row align-items-center *ngFor="let img of img360" padding>
      <ion-col size="10"  class="columna" [ngStyle]="{'background-image': 'url(' +this.server.DOMAINIMG +'/archivos/toma/' + img.url + ')', 'background-size': 'cover', 'opacity':'0.8','border-radius': '1'  }" align-items-center (click)="ver360(img.id,img.nombre,img.lugar)">
        
        <ion-label><ion-icon name="pin"></ion-icon> {{img.lugar}}</ion-label>
      </ion-col>
    </ion-row>
