<ion-header>
    <ion-navbar color="pederNaranja">
      <button ion-button menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
      <ion-title>
        <!-- <strong>Ionic 3</strong> Start Theme -->
        {{ titulo }}
      </ion-title>
    </ion-navbar>
  </ion-header>


  <ion-content padding class="animated fadeIn common-bg">
    <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
      <ion-refresher-content
        pullingIcon="arrow-dropdown"
        pullingText="Pull to refresh"
        refreshingSpinner="circles"
        refreshingText="Cargando...">
      </ion-refresher-content>
    </ion-refresher>
    <div *ngIf="this.contenido!=false">
      <div *ngFor="let item of aux">
        <div  class="container trip-info card round"  color="pederNaranja" no-padding>
          <ion-card no-padding>
            <div >
              {{item.nimage}}
              <ion-slides #slides *ngIf="item.nimage>1" autoplay="5000" loop="true" speed="500" class="slides" pager="true">
                <ion-slide *ngFor="let img of item.image">
                  <img src="{{ this.server.DOMAINIMG }}/archivos/toma/{{  img.url }}/400x300" />
                </ion-slide>
              </ion-slides>
              <div *ngIf="item.nimage==1">
                <img  *ngFor="let img of item.image" src="{{ this.server.DOMAINIMG }}/archivos/toma/{{  img.url }}/400x300" alt="">
              </div>
              <div *ngIf="item.nimage==0">
                <!-- <img  *ngFor="let img of item.image" src="{{ this.server.DOMAINIMG }}/archivos/toma/{{  img.url }}" alt=""> -->
              </div>
            </div>
            <ion-fab right top *ngIf="item.lat!=0">
              <button ion-fab (click)="irUbicacion(item.lat,item.lng)">
                <ion-icon name="pin"></ion-icon>
              </button>
            </ion-fab>
            <!-- <ion-fab left top >
              <button ion-fab (click)="videos()">
                <ion-icon name="logo-youtube"></ion-icon>
              </button>
            </ion-fab> -->
            <ion-item class="pCuerpo">
                <ion-icon name="pin" item-start large ></ion-icon>
                <h2>{{ item.lugar }}</h2>
              </ion-item>
            <ion-card-content>
              <ion-card-title class="pPrincipal">
                {{ item.titulo }}
                </ion-card-title>
                <p class="pCuerpo">{{ item.descripcion }}</p>
            </ion-card-content>
          </ion-card>
        </div> 
        <br>
        <br>
      </div>
    </div>
  </ion-content>
